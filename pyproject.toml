[project]
name = "automation"
version = "0.1.0"
description = "Stealth browser automation over CDP: persistent profile, CAPTCHA solving, concurrent tabs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "patchright>=1.63.0",
    "seleniumbase>=4.56.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
