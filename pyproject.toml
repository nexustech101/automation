[project]
name = "automation"
version = "0.1.0"
description = "A browser automation tool for web scraping and testing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
    "imageio>=2.37.0",
    "pyautogui>=0.9.54",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "registers>=7.5.0",
    "pandas>=3.0.6",
    "langchain-core>=1.6.3",
    "langchain>=1.4.2",
    "langchain-ollama>=1.1.0",
    "rich>=15.0.0",
    "patchright>=1.63.0",
    "agentql>=1.19.0",
    "lxml>=6.1.3",
    "jsonschema>=4.26.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "fastapi[standard]>=0.141.1",
    "sqlmodel>=0.0.48",
    "sqlalchemy>=2.0.54",
    "lark>=1.2.2",
    "python-dotenv>=1.2.3",
    "browser-use>=0.11.13",
    "ollama>=0.6.2",
    "httpx>=0.28.1",
    "seleniumbase>=4.56.2",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
